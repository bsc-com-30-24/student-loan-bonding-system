openapi: 3.0.3
info:
  title: Student Loan Bonding System API
  version: 1.0.0
  description: RESTful APIs for student loan document submission, verification, agreement
    generation, signing, storage, retrieval, status tracking, and reporting.
paths:
  /api/agreements/:
    get:
      operationId: agreements_list
      tags:
      - agreements
      security:
      - jwtAuth: []
      - cookieAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Agreement'
          description: ''
  /api/agreements/{agreement_number}/:
    get:
      operationId: agreements_retrieve
      parameters:
      - in: path
        name: agreement_number
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - agreements
      security:
      - jwtAuth: []
      - cookieAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agreement'
          description: ''
  /api/agreements/{agreement_number}/countersign/:
    post:
      operationId: agreements_countersign_create
      parameters:
      - in: path
        name: agreement_number
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - agreements
      security:
      - jwtAuth: []
      - cookieAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: No response body
  /api/agreements/{agreement_number}/sign/:
    post:
      operationId: agreements_sign_create
      description: Records the student's signing timestamp and changes the agreement
        status to SIGNED.
      summary: Sign a student loan bonding agreement
      parameters:
      - in: path
        name: agreement_number
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Agreements
      security:
      - jwtAuth: []
      - cookieAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agreement'
          description: ''
  /api/agreements/generate/:
    post:
      operationId: agreements_generate_create
      description: Generates an agreement for the authenticated student and returns
        the agreement details.
      summary: Generate a student loan bonding agreement
      tags:
      - Agreements
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgreementGenerateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AgreementGenerateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AgreementGenerateRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agreement'
          description: ''
  /api/token/:
    post:
      operationId: token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/token/refresh/:
    post:
      operationId: token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
components:
  schemas:
    Agreement:
      type: object
      properties:
        agreement_number:
          type: string
          format: uuid
          readOnly: true
        student_id:
          type: string
          maxLength: 50
        loan_reference:
          type: string
          maxLength: 100
        agreement_content:
          type: string
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        generated_at:
          type: string
          format: date-time
          readOnly: true
        student_signed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        board_countersigned_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - agreement_content
      - agreement_number
      - board_countersigned_at
      - created_at
      - generated_at
      - loan_reference
      - status
      - student_id
      - student_signed_at
      - updated_at
    AgreementGenerateRequest:
      type: object
      properties:
        student_id:
          type: string
          maxLength: 50
        loan_reference:
          type: string
          maxLength: 100
      required:
      - loan_reference
      - student_id
    StatusEnum:
      enum:
      - GENERATED
      - PENDING_SIGNATURE
      - SIGNED
      - COUNTERSIGNED
      type: string
      description: |-
        * `GENERATED` - Generated
        * `PENDING_SIGNATURE` - Pending Signature
        * `SIGNED` - Signed
        * `COUNTERSIGNED` - Countersigned
    TokenObtainPair:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - password
      - refresh
      - username
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
